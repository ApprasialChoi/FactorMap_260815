<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그밖의요인 통계맵</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; overflow: hidden; }

    /* ===== 지도 ===== */
    #map, #kakao-map { position: absolute; top: 0; right: 0; bottom: 0; left: 340px; width: calc(100% - 340px); }
    #kakao-map { z-index: 0; }
    #map { z-index: 1; background: transparent; }

    /* ===== 사이드 패널 ===== */
    #side-panel {
        position: fixed; top: 0; left: 0; width: 340px; height: 100%;
        background: #fff; z-index: 3000; display: flex; flex-direction: column;
        box-shadow: 2px 0 12px rgba(0,0,0,0.08);
    }
    .panel-header { padding: 16px 20px 13px; background: linear-gradient(135deg, #1a365d, #2b6cb0); color: white; }
    .panel-header h1 { font-size: 17px; font-weight: 700; }
    .panel-header .subtitle { font-size: 11px; opacity: 0.85; margin-top: 2px; }
    .panel-count { font-size: 12px; margin-top: 7px; font-weight: 600; }
    .panel-count b { color: #fbd38d; font-size: 14px; }

    #panel-scroll { flex: 1; overflow-y: auto; }
    .filter-section { padding: 10px 16px; border-bottom: 1px solid #edf2f7; }
    .filter-section > label { font-size: 11px; font-weight: 700; color: #718096; display: block; margin-bottom: 6px; }
    .filter-section > label small { font-weight: 400; color: #a0aec0; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
        padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
        cursor: pointer; border: 1.5px solid #e2e8f0; background: white; color: #4a5568;
        transition: all 0.12s; user-select: none;
    }
    .chip:hover { border-color: #2b6cb0; }
    .chip.active { color: white; border-color: transparent; background: #2b6cb0; }
    .chip.c-type0.active { background: #7c3aed; }
    .chip.c-type1.active { background: #0d9488; }
    .chip.c-type2.active { background: #c2410c; }
    .chip.c-all.active { background: #4a5568; }
    .chip.c-metric.active { background: #0051af; }

    /* ===== 내려받기 · 지도 컨트롤 ===== */
    .dl-row { display: flex; gap: 6px; }
    .btn {
        flex: 1; padding: 7px 8px; border-radius: 8px; border: 1.5px solid #cbd5e0;
        background: #fff; color: #2d3748; font-size: 11.5px; font-weight: 700;
        cursor: pointer; font-family: inherit; transition: all .12s;
    }
    .btn:hover { border-color: #0051af; color: #0051af; }
    .btn.primary { background: #0051af; border-color: #0051af; color: #fff; }
    .btn.primary:hover { background: #003d85; color: #fff; }

    #map-tools {
        position: absolute; top: 12px; right: 12px; z-index: 1200;
        display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    }
    #map-tools button {
        padding: 7px 12px; border-radius: 8px; border: 1.5px solid rgba(26,54,93,.2);
        background: rgba(255,255,255,.96); color: #2d3748; font-size: 12px; font-weight: 700;
        cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(15,23,42,.15);
        white-space: nowrap;
    }
    #map-tools button.on { background: #0051af; color: #fff; border-color: #0051af; }

    /* ===== 통계 ===== */
    .stat-section { padding: 12px 16px; border-bottom: 1px solid #edf2f7; background: linear-gradient(180deg,#fafbff,#fff); }
    .stat-title { font-size: 11px; font-weight: 700; color: #0051af; letter-spacing: .5px; margin-bottom: 8px; }
    .rep-box {
        display: flex; gap: 8px; margin-bottom: 10px;
    }
    .rep-card { flex: 1; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 8px 10px; text-align: center; }
    .rep-card.hero { border-color: #0051af; background: #f0f7ff; }
    .rep-card .k { font-size: 10px; color: #718096; font-weight: 600; }
    .rep-card .v { font-size: 19px; font-weight: 800; color: #1a365d; margin-top: 1px; }
    .rep-card.hero .v { color: #0051af; }
    .rep-card .s { font-size: 9.5px; color: #a0aec0; }

    table.stat-tbl { width: 100%; border-collapse: collapse; font-size: 11px; }
    .stat-tbl th { background: #edf2f7; color: #4a5568; font-weight: 700; padding: 4px 6px; text-align: right; }
    .stat-tbl th:first-child { text-align: left; }
    .stat-tbl td { padding: 4px 6px; border-bottom: 1px solid #f1f5f9; text-align: right; font-variant-numeric: tabular-nums; }
    .stat-tbl td:first-child { text-align: left; font-weight: 600; color: #4a5568; }
    .stat-tbl tr.hl td { background: #f0f7ff; font-weight: 700; }
    .stat-sub { font-size: 10px; color: #a0aec0; margin-top: 6px; line-height: 1.6; }

    #histo { width: 100%; height: 110px; margin-top: 8px; background: #fff; border: 1px solid #edf2f7; border-radius: 8px; }

    /* 리 목록 */
    #ri-list { }
    .ri-item { display: flex; align-items: center; padding: 7px 16px; border-bottom: 1px solid #f7fafc; cursor: pointer; font-size: 12px; }
    .ri-item:hover { background: #f0f7ff; }
    .ri-item.sel { background: #e6f0fd; }
    .ri-item .nm { font-weight: 700; color: #2d3748; flex: 1; }
    .ri-item .nm small { font-weight: 400; color: #a0aec0; margin-left: 4px; }
    .ri-item .md { font-weight: 700; color: #0051af; width: 52px; text-align: right; }
    .ri-item .ct { color: #718096; width: 58px; text-align: right; font-size: 11px; }
    .empty-state { padding: 30px 20px; text-align: center; color: #a0aec0; font-size: 12px; }

    /* 밸류맵식 개별 마커 — 1줄: 용도지역|지대, 2줄: 토지단가 */
    .vm-wrap { background: none; border: none; }
    .vm {
        display: inline-block; white-space: nowrap; cursor: pointer;
        background: #fff; border-radius: 7px; overflow: hidden;
        box-shadow: 0 2px 7px rgba(15,23,42,.28); border: 1.5px solid rgba(26,54,93,.35);
        font-family: inherit; position: relative;
    }
    .vm-top { display: flex; font-size: 10px; font-weight: 700; color: #fff; }
    .vm-top span { padding: 1.5px 6px; }
    .vm-top .vm-j { background: rgba(0,0,0,.18); }
    .vm.t0 .vm-top { background: #7c3aed; }
    .vm.t1 .vm-top { background: #0d9488; }
    .vm.t2 .vm-top { background: #c2410c; }
    .vm-p { padding: 1px 6px 2px; text-align: center; font-size: 11.5px; font-weight: 800; color: #1a365d; font-variant-numeric: tabular-nums; }
    .vm.t2 { border-style: dashed; border-color: #c2410c; }
    .vm.t2 .vm-p::after { content: '배분'; font-size: 8.5px; font-weight: 700; color: #c2410c; margin-left: 3px; vertical-align: 1px; }
    .vm-more {
        background: rgba(26,54,93,.88); color: #fff; border-radius: 12px;
        padding: 3px 10px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }

    /* 지도 라벨 */
    .pill-wrap { background: none; border: none; }
    .ri-pill {
        display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
        background: #fff; border: 1.5px solid rgba(26,54,93,.25); border-radius: 14px;
        padding: 2px 9px 2px 7px; font-size: 11px; font-weight: 700; color: #1a365d;
        box-shadow: 0 2px 6px rgba(15,23,42,.18); cursor: pointer; font-family: inherit;
    }
    .ri-pill .dot { width: 9px; height: 9px; border-radius: 50%; }
    .ri-pill small { font-weight: 600; color: #718096; font-size: 10px; }
    .ri-pill.sel { outline: 2.5px solid #0051af; }
    .leaflet-popup-content { font-size: 12px; line-height: 1.65; margin: 10px 13px; }
    .leaflet-popup-content h4 { font-size: 13px; margin-bottom: 4px; color: #1a365d; }
</style>
</head>
<body>

<div id="side-panel">
    <div class="panel-header">
        <h1>📊 그밖의요인 통계맵</h1>
        <div class="subtitle">개공비율(사례단가 ÷ 개별공시지가) 기반 · 해남·영암·무안</div>
        <div class="panel-count">선택 <b id="cnt-sel">0</b>건 / 전체 <span id="cnt-all">0</span>건</div>
    </div>
    <div id="panel-scroll">
        <div class="filter-section">
            <label>사례 유형</label>
            <div class="filter-row" id="f-type"></div>
        </div>
        <div class="filter-section">
            <label>지역 <small>— 시군구 → 읍면 → 리 (리는 복수 선택)</small></label>
            <div class="filter-row" id="f-sgg" style="margin-bottom:5px;"></div>
            <div class="filter-row" id="f-emd" style="margin-bottom:5px;"></div>
            <div class="filter-row" id="f-ri"></div>
        </div>
        <div class="filter-section">
            <label>용도지역 <small>— 미선택 시 전체</small></label>
            <div class="filter-row" id="f-zone"></div>
        </div>
        <div class="filter-section">
            <label>이용상황 (지목 그룹)</label>
            <div class="filter-row" id="f-use"></div>
        </div>
        <div class="filter-section">
            <label>기간</label>
            <div class="filter-row" id="f-year"></div>
        </div>
        <div class="filter-section">
            <label>배분사례 품질 <small>— 거래사례(배분)에만 적용</small></label>
            <div class="filter-row" id="f-q"></div>
        </div>

        <div class="stat-section">
            <div class="stat-title">지표 선택</div>
            <div class="filter-row" id="f-metric" style="margin-bottom:10px;"></div>
            <div class="stat-title" id="stat-head">대푯값 (그밖의 요인 산정 참고)</div>
            <div class="rep-box">
                <div class="rep-card hero">
                    <div class="k">정제 중위값</div>
                    <div class="v" id="rep-med">–</div>
                    <div class="s">IQR 1.5× 이상치 제거 후</div>
                </div>
                <div class="rep-card">
                    <div class="k">절사평균 10%</div>
                    <div class="v" id="rep-trim">–</div>
                    <div class="s">상·하위 10% 제외</div>
                </div>
            </div>
            <div class="rep-box" id="rep-sub"></div>
            <table class="stat-tbl">
                <thead><tr><th>구분</th><th>n</th><th>평균</th><th>중위</th><th>표준편차</th></tr></thead>
                <tbody id="stat-body"></tbody>
            </table>
            <canvas id="histo" width="600" height="220"></canvas>
            <div class="stat-sub" id="stat-note"></div>
        </div>

        <div class="filter-section">
            <label>내려받기 <small>— 화면에 표시된 조건 그대로</small></label>
            <div class="dl-row">
                <button class="btn primary" id="btn-xlsx">엑셀(.xlsx)</button>
                <button class="btn" id="btn-csv">CSV</button>
            </div>
            <div class="stat-sub" id="dl-note" style="margin-top:6px;"></div>
        </div>

        <div class="filter-section" style="border-bottom:none; padding-bottom:4px;">
            <label id="ri-head">리별 정제 중위값 <small>— 클릭하면 해당 리만 선택</small></label>
        </div>
        <div id="ri-list"></div>
    </div>
</div>

<div id="kakao-map"></div>
<div id="map"></div>
<div id="map-tools">
    <button id="btn-cadastral" title="카카오맵 지적편집도 — 용도지역 색상 표시">🗺️ 지적편집도(용도지역)</button>
    <button id="btn-hybrid" title="위성 + 라벨">🛰️ 위성</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=231190ac1aca72ada0b739110d8a0eb4"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/kakao_base.js"></script>
<script src="data/records.js"></script>
<script>
(function () {
    'use strict';
    var META = window.FM_META, ROWS = window.FM_ROWS, CENTERS = window.FM_CENTERS;

    // ───────── 상태 ─────────
    var TYPES = META.types || ['평가사례', '거래사례'];
    var S = { types: {}, sgg: null, emd: null, ris: {}, zones: {}, uses: {},
              yearMin: 0, q: {0: true, 1: false}, metric: 'r' };
    TYPES.forEach(function (_, i) { S.types[i] = true; });

    // ───────── 지표 ─────────
    //  r = 개공비율(사례단가 ÷ 개별공시지가) · p = 토지단가(원/㎡)
    //    t=0 평가사례      p = 사례 토지단가
    //    t=1 거래사례      p = 토지 거래단가 (나지)
    //    t=2 거래사례(배분) p = (거래금액 − 건물가격) ÷ 토지면적
    var METRIC = {
        r: {label: '개공비율', unit: '', fmt: function (v) { return isFinite(v) ? v.toFixed(3) : '–'; },
            fmt2: function (v) { return isFinite(v) ? v.toFixed(2) : '–'; },
            head: '대푯값 (그밖의 요인 산정 참고)', get: function (x) { return x.r; }},
        p: {label: '토지단가', unit: '원/㎡',
            fmt: function (v) { return isFinite(v) ? Math.round(v).toLocaleString() : '–'; },
            fmt2: function (v) { return isFinite(v) ? Math.round(v).toLocaleString() : '–'; },
            head: '대푯값 (토지단가 · 원/㎡)', get: function (x) { return x.p; }}
    };
    function M() { return METRIC[S.metric]; }
    function val(x) { return M().get(x); }

    // ───────── 통계 유틸 ─────────
    function quantile(a, p) {           // a 오름차순
        if (!a.length) return NaN;
        var i = (a.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
        return a[lo] + (a[hi] - a[lo]) * (i - lo);
    }
    function mean(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : NaN; }
    function stdev(a) {
        if (a.length < 2) return NaN;
        var m = mean(a);
        return Math.sqrt(a.reduce(function (s, v) { return s + (v - m) * (v - m); }, 0) / (a.length - 1));
    }
    function stats(vals) {              // vals: 정렬 안 된 r 배열
        var a = vals.slice().sort(function (x, y) { return x - y; });
        var q1 = quantile(a, 0.25), q3 = quantile(a, 0.75), iqr = q3 - q1;
        var lo = q1 - 1.5 * iqr, hi = q3 + 1.5 * iqr;
        var ref = a.filter(function (v) { return v >= lo && v <= hi; });
        var k = Math.floor(a.length * 0.1);
        var trim = a.slice(k, a.length - k);
        return {
            raw: a, ref: ref, trim: trim,
            q1: q1, q3: q3, fenceLo: lo, fenceHi: hi,
            removed: a.length - ref.length
        };
    }
    var f2 = function (v) { return isFinite(v) ? v.toFixed(2) : '–'; };
    var f3 = function (v) { return isFinite(v) ? v.toFixed(3) : '–'; };

    // ───────── 필터 ─────────
    function basePass(x) {
        if (!S.types[x.t]) return false;
        if (x.t === 2 && !S.q[x.q || 0]) return false;       // 배분사례 품질(O/△)
        if (S.sgg && x.s !== S.sgg) return false;
        if (S.emd && x.e !== S.emd) return false;
        var zk = Object.keys(S.zones);
        if (zk.length && !S.zones[x.z]) return false;
        var uk = Object.keys(S.uses);
        if (uk.length && !S.uses[x.u]) return false;
        if (S.yearMin && x.y < S.yearMin) return false;
        if (!isFinite(val(x)) || val(x) <= 0) return false;   // 토지단가 미기재분 제외
        return true;
    }
    function pass(x) {
        if (!basePass(x)) return false;
        var rk = Object.keys(S.ris);
        if (rk.length && !S.ris[x.s + '|' + x.e + '|' + x.l]) return false;
        return true;
    }
    // 리 필터를 뺀 통과 (지도 pill·리 목록용)
    function passNoRi(x) { return basePass(x); }

    // ───────── 칩 렌더 ─────────
    function chipRow(el, items, isActive, onClick, cls) {
        el.innerHTML = '';
        items.forEach(function (it) {
            var c = document.createElement('div');
            c.className = 'chip ' + (cls ? cls(it) : '') + (isActive(it) ? ' active' : '');
            c.textContent = it.label;
            c.onclick = function () { onClick(it); refresh(); };
            el.appendChild(c);
        });
    }

    function renderFilters() {
        chipRow(document.getElementById('f-metric'),
            [{label: '개공비율', v: 'r'}, {label: '토지단가(원/㎡)', v: 'p'}],
            function (it) { return S.metric === it.v; },
            function (it) { S.metric = it.v; },
            function () { return 'c-metric'; });

        chipRow(document.getElementById('f-type'),
            TYPES.map(function (t, i) { return {label: t, v: i}; }),
            function (it) { return S.types[it.v]; },
            function (it) { S.types[it.v] = !S.types[it.v]; },
            function (it) { return 'c-type' + it.v; });

        chipRow(document.getElementById('f-q'),
            [{label: 'O 사용 가능', v: 0}, {label: '△ 검토 필요', v: 1}],
            function (it) { return !!S.q[it.v]; },
            function (it) { S.q[it.v] = !S.q[it.v]; });

        var sggs = {};
        ROWS.forEach(function (x) { sggs[x.s] = 1; });
        chipRow(document.getElementById('f-sgg'),
            [{label: '전체', v: null}].concat(Object.keys(sggs).sort().map(function (s) { return {label: s, v: s}; })),
            function (it) { return S.sgg === it.v; },
            function (it) { S.sgg = it.v; S.emd = null; S.ris = {}; renderFilters(); },
            function (it) { return it.v === null ? 'c-all' : ''; });

        var emds = {};
        ROWS.forEach(function (x) { if (!S.sgg || x.s === S.sgg) emds[x.e] = 1; });
        chipRow(document.getElementById('f-emd'),
            [{label: '읍면 전체', v: null}].concat(Object.keys(emds).sort().map(function (e) { return {label: e, v: e}; })),
            function (it) { return S.emd === it.v; },
            function (it) { S.emd = it.v; S.ris = {}; renderFilters(); },
            function (it) { return it.v === null ? 'c-all' : ''; });

        var ris = {};
        ROWS.forEach(function (x) {
            if ((!S.sgg || x.s === S.sgg) && (!S.emd || x.e === S.emd)) ris[x.s + '|' + x.e + '|' + x.l] = x.l;
        });
        var riItems = Object.keys(ris).sort().map(function (k) { return {label: ris[k], v: k}; });
        chipRow(document.getElementById('f-ri'),
            (S.emd ? riItems : []),        // 리 칩은 읍면을 고른 뒤에만 (50개 나열 방지)
            function (it) { return !!S.ris[it.v]; },
            function (it) { if (S.ris[it.v]) delete S.ris[it.v]; else S.ris[it.v] = 1; });

        // 칩은 앞 12종(용도지역)·5그룹(이용상황)만 — 그 외(농림 등)는 칩 미선택(전체)일 때만 포함
        chipRow(document.getElementById('f-zone'),
            META.zones.slice(0, META.nzchip || META.zones.length)
                .map(function (z, i) { return {label: z.replace('지역', ''), v: i}; }),
            function (it) { return !!S.zones[it.v]; },
            function (it) { if (S.zones[it.v]) delete S.zones[it.v]; else S.zones[it.v] = 1; });

        chipRow(document.getElementById('f-use'),
            META.uses.slice(0, META.nuchip || META.uses.length)
                .map(function (u, i) { return {label: u, v: i}; }),
            function (it) { return !!S.uses[it.v]; },
            function (it) { if (S.uses[it.v]) delete S.uses[it.v]; else S.uses[it.v] = 1; });

        chipRow(document.getElementById('f-year'),
            [{label: '전체', v: 0}, {label: '2022~', v: 2022}, {label: '2023~', v: 2023},
             {label: '2024~', v: 2024}, {label: '2025~', v: 2025}, {label: '2026', v: 2026}],
            function (it) { return S.yearMin === it.v; },
            function (it) { S.yearMin = it.v; },
            function (it) { return it.v === 0 ? 'c-all' : ''; });
    }

    // ───────── 통계 패널 ─────────
    function renderStats(sel) {
        var body = document.getElementById('stat-body');
        var note = document.getElementById('stat-note');
        document.getElementById('stat-head').textContent = M().head;
        document.getElementById('ri-head').innerHTML =
            '리별 정제 중위값 <small>— ' + M().label + ' · 클릭하면 해당 리만 선택</small>';
        // 유형별 보조 카드 (평가 / 거래 / 배분 중위값)
        var sub = document.getElementById('rep-sub');
        sub.innerHTML = TYPES.map(function (t, i) {
            var a = sel.filter(function (x) { return x.t === i; }).map(val)
                       .sort(function (p, q) { return p - q; });
            if (!a.length) return '';
            return '<div class="rep-card"><div class="k">' + t + '</div><div class="v" style="font-size:15px">' +
                   M().fmt(quantile(a, 0.5)) + '</div><div class="s">n=' + a.length + ' · 중위</div></div>';
        }).join('');
        if (sel.length < 3) {
            LAST_ST = null;
            document.getElementById('rep-med').textContent = '–';
            document.getElementById('rep-trim').textContent = '–';
            body.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#a0aec0;">표본 3건 이상 필요</td></tr>';
            note.textContent = '';
            drawHisto(null);
            return;
        }
        var vals = sel.map(val);
        var st = stats(vals);
        LAST_ST = st;
        document.getElementById('rep-med').textContent = M().fmt(quantile(st.ref, 0.5));
        document.getElementById('rep-trim').textContent = M().fmt(mean(st.trim));
        var rows = [
            ['원자료', st.raw, false],
            ['IQR 정제', st.ref, true],
            ['10% 절사', st.trim, false]
        ];
        var fm = M().fmt, fs = M().fmt2;
        body.innerHTML = rows.map(function (r) {
            var a = r[1];
            return '<tr' + (r[2] ? ' class="hl"' : '') + '><td>' + r[0] + '</td><td>' + a.length +
                   '</td><td>' + fm(mean(a)) + '</td><td>' + fm(quantile(a.slice().sort(function(x,y){return x-y;}), 0.5)) +
                   '</td><td>' + fm(stdev(a)) + '</td></tr>';
        }).join('');
        note.innerHTML = 'Q1 ' + fs(st.q1) + ' · Q3 ' + fs(st.q3) +
            ' · 최소 ' + fs(st.raw[0]) + ' · 최대 ' + fs(st.raw[st.raw.length - 1]) +
            ' &nbsp;|&nbsp; IQR 정제로 <b>' + st.removed + '건</b> 제거 (경계 ' +
            fs(Math.max(0, st.fenceLo)) + '~' + fs(st.fenceHi) + ')' +
            (M().unit ? ' &nbsp;<span style="color:#a0aec0">단위 ' + M().unit + '</span>' : '');
        drawHisto(st);
    }

    function drawHisto(st) {
        var cv = document.getElementById('histo'), ctx = cv.getContext('2d');
        ctx.clearRect(0, 0, cv.width, cv.height);
        if (!st || st.raw.length < 3) return;
        var a = st.raw;
        var lo = 0, hi = Math.min(a[a.length - 1], quantile(a, 0.99) * 1.15);
        if (hi <= lo) hi = a[a.length - 1] || 1;
        var nb = 28, bins = new Array(nb).fill(0), binsRef = new Array(nb).fill(0);
        a.forEach(function (v) {
            var i = Math.min(nb - 1, Math.floor((v - lo) / (hi - lo) * nb));
            if (i >= 0) { bins[i]++; if (v >= st.fenceLo && v <= st.fenceHi) binsRef[i]++; }
        });
        var max = Math.max.apply(null, bins) || 1;
        var W = cv.width, H = cv.height, pb = 26, pt = 8;
        var bw = W / nb;
        for (var i = 0; i < nb; i++) {
            var h1 = (H - pb - pt) * bins[i] / max;
            var h2 = (H - pb - pt) * binsRef[i] / max;
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(i * bw + 1, H - pb - h1, bw - 2, h1);
            ctx.fillStyle = '#63a2e4';
            ctx.fillRect(i * bw + 1, H - pb - h2, bw - 2, h2);
        }
        function vx(v) { return (v - lo) / (hi - lo) * W; }
        var med = quantile(st.ref, 0.5);
        ctx.strokeStyle = '#0051af'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(vx(med), pt); ctx.lineTo(vx(med), H - pb); ctx.stroke();
        ctx.setLineDash([5, 4]); ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 1.5;
        [st.fenceLo, st.fenceHi].forEach(function (f) {
            if (f > lo && f < hi) { ctx.beginPath(); ctx.moveTo(vx(f), pt); ctx.lineTo(vx(f), H - pb); ctx.stroke(); }
        });
        ctx.setLineDash([]);
        ctx.fillStyle = '#718096'; ctx.font = '20px Pretendard, sans-serif'; ctx.textAlign = 'center';
        var ax = S.metric === 'p'
            ? function (v) { return Math.round(v / 1000) + 'k'; }
            : function (v) { return v.toFixed(1); };
        for (var t = 0; t <= 4; t++) {
            var v = lo + (hi - lo) * t / 4;
            ctx.fillText(ax(v), (W * t / 4) || 14, H - 6);
        }
        ctx.textAlign = 'left'; ctx.fillStyle = '#0051af';
        ctx.fillText('중위 ' + M().fmt(med), Math.min(vx(med) + 6, W - 180), pt + 18);
    }

    // ───────── 리 목록 + 지도 ─────────
    var map = L.map('map', {zoomControl: true}).setView([34.75, 126.45], 11);
    window._fmMap = map;    // 디버그·자동검증용 핸들
    try {
        initKakaoBaseMap(map);
    } catch (e) {
        // 카카오 SDK 미로드(로컬 등 도메인 제한) — 통계·필터는 그대로 동작
        console.warn('카카오 베이스맵 없이 실행:', e.message);
        document.getElementById('kakao-map').style.background = '#e8edf3';
    }
    var pillLayer = L.layerGroup().addTo(map);

    var SCALE = {lo: 0.8, hi: 2.6};     // 색 스케일 (지표에 따라 갱신)
    function colorOf(v) {
        if (!isFinite(v)) return '#a0aec0';
        var t = Math.max(0, Math.min(1, (v - SCALE.lo) / (SCALE.hi - SCALE.lo)));
        var r = Math.round(37 + t * (220 - 37));
        var g = Math.round(99 + t * (38 - 99));
        var b = Math.round(235 + t * (38 - 235));
        return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    function riAgg() {
        var by = {};
        ROWS.forEach(function (x) {
            if (!passNoRi(x)) return;
            var k = x.s + '|' + x.e + '|' + x.l;
            (by[k] = by[k] || []).push(val(x));
        });
        return by;
    }

    // ───────── 밸류맵식 개별 마커 (줌 14+ · 화면 범위 · 필지 좌표) ─────────
    var vmLayer = L.layerGroup().addTo(map);
    var VM_ZOOM = 14, VM_CAP = 600;
    var ZSHORT = {'제1종전용주거지역': '1종전주', '제2종전용주거지역': '2종전주',
                  '제1종일반주거지역': '1종일주', '제2종일반주거지역': '2종일주',
                  '제3종일반주거지역': '3종일주', '자연환경보전지역': '자연환경',
                  '기타·미상': '미상'};
    function zshort(i) {
        var z = META.zones[i] || '';
        return ZSHORT[z] || z.replace('지역', '').replace('구역', '');
    }
    function jdOf(x) { return (META.jd && META.jd[x.j] != null) ? META.jd[x.j] : ''; }
    function fmtWon(v) { return v == null ? '–' : Number(v).toLocaleString('ko-KR'); }
    function escv(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }

    function vmPopup(x) {
        return '<h4>' + TYPES[x.t] +
            (x.t === 2 ? ' · <span style="color:#c2410c;">' + ((x.q || 0) === 0 ? 'O 사용가능' : '△ 검토필요') + '</span>' : '') + '</h4>' +
            escv(x.a || (x.s + ' ' + x.e + ' ' + x.l)) + '<br>' +
            '연도 ' + (x.y || '–') + ' · ' + escv(META.zones[x.z]) +
            (jdOf(x) ? ' · 지대 ' + escv(jdOf(x)) : '') + '<br>' +
            '토지단가 <b>' + fmtWon(x.p) + '</b> 원/㎡' +
            (x.g ? ' · 공시지가 ' + fmtWon(x.g) : '') +
            (x.r ? ' · 개공비율 <b>' + Number(x.r).toFixed(3) + '</b>' : '');
    }

    function renderMarkers() {
        vmLayer.clearLayers();
        if (map.getZoom() < VM_ZOOM) return;
        var bd = map.getBounds();
        var cand = [];
        for (var i = 0; i < ROWS.length; i++) {
            var x = ROWS[i];
            if (!x.ll || !pass(x)) continue;
            if (!bd.contains(x.ll)) continue;
            cand.push(x);
        }
        var total = cand.length;
        // 상한 초과 시 희소 유형(배분·거래)이 평가사례에 밀려 안 보이는 일이 없도록 유형 우선
        if (total > VM_CAP) cand.sort(function (a, b) { return b.t - a.t; });
        var sel = cand.slice(0, VM_CAP);
        sel.forEach(function (x) {
            var html = '<div class="vm t' + x.t + '">' +
                '<div class="vm-top"><span class="vm-z">' + zshort(x.z) + '</span>' +
                '<span class="vm-j">' + escv(jdOf(x) || META.uses[x.u]) + '</span></div>' +
                '<div class="vm-p">' + fmtWon(x.p) + '</div></div>';
            var m = L.marker(x.ll, {icon: L.divIcon({className: 'vm-wrap', html: html,
                iconSize: null, iconAnchor: [34, 16]})});
            m.bindPopup(vmPopup(x), {maxWidth: 330});
            m.addTo(vmLayer);
        });
        if (total > sel.length) {
            try {
                L.marker(map.getCenter(), {interactive: false, icon: L.divIcon({className: 'vm-wrap',
                    html: '<span class="vm-more">화면 내 ' + total.toLocaleString() + '건 중 ' + VM_CAP + '건만 표시 — 더 확대하세요</span>',
                    iconSize: null, iconAnchor: [110, -170]})}).addTo(vmLayer);
            } catch (e) { /* 컨테이너 크기 0 등으로 중심 계산 불가 시 안내만 생략 */ }
        }
    }

    function updateLayerMode() {
        if (map.getZoom() >= VM_ZOOM) {
            if (map.hasLayer(pillLayer)) map.removeLayer(pillLayer);
        } else if (!map.hasLayer(pillLayer)) {
            map.addLayer(pillLayer);
        }
        renderMarkers();
    }
    map.on('zoomend', updateLayerMode);
    map.on('moveend', renderMarkers);

    function renderMapAndList() {
        var by = riAgg();
        pillLayer.clearLayers();
        var listEl = document.getElementById('ri-list');
        listEl.innerHTML = '';
        var entries = Object.keys(by).map(function (k) {
            var st = by[k].length >= 3 ? stats(by[k]) : null;
            var md = st ? quantile(st.ref, 0.5) : (by[k].length ? by[k].slice().sort(function(a,b){return a-b;})[Math.floor(by[k].length/2)] : NaN);
            return {k: k, n: by[k].length, md: md};
        }).sort(function (a, b) { return b.n - a.n; });

        if (!entries.length) listEl.innerHTML = '<div class="empty-state">조건에 맞는 사례가 없습니다</div>';

        // 색 스케일 : 지표별로 표본 분포에 맞춤
        var mds = entries.map(function (e) { return e.md; }).filter(isFinite).sort(function (a, b) { return a - b; });
        if (mds.length) { SCALE.lo = quantile(mds, 0.1); SCALE.hi = quantile(mds, 0.9); }
        if (!(SCALE.hi > SCALE.lo)) { SCALE.lo = 0; SCALE.hi = (mds[mds.length - 1] || 1) || 1; }
        var short = S.metric === 'p'
            ? function (v) { return isFinite(v) ? (v >= 10000 ? Math.round(v / 1000) + 'k' : Math.round(v)) : '–'; }
            : function (v) { return isFinite(v) ? v.toFixed(2) : '–'; };

        entries.forEach(function (e) {
            var parts = e.k.split('|');
            var sel = !!S.ris[e.k];
            var ll = CENTERS[e.k];
            if (ll) {
                var pill = L.marker(ll, {icon: L.divIcon({className: 'pill-wrap',
                    html: '<span class="ri-pill' + (sel ? ' sel' : '') + '"><span class="dot" style="background:' + colorOf(e.md) + '"></span>' +
                          parts[2] + ' ' + short(e.md) + ' <small>n=' + e.n + '</small></span>',
                    iconSize: null, iconAnchor: [40, 12]})});
                pill.on('click', function () {
                    if (S.ris[e.k]) delete S.ris[e.k]; else S.ris[e.k] = 1;
                    refresh();
                });
                pill.addTo(pillLayer);
            }
            var it = document.createElement('div');
            it.className = 'ri-item' + (sel ? ' sel' : '');
            it.innerHTML = '<span class="nm">' + parts[2] + '<small>' + parts[0] + ' ' + parts[1] + '</small></span>' +
                           '<span class="md">' + short(e.md) + '</span>' +
                           '<span class="ct">' + e.n + '건</span>';
            it.onclick = function () {
                if (S.ris[e.k]) delete S.ris[e.k]; else S.ris[e.k] = 1;
                refresh();
            };
            listEl.appendChild(it);
        });
    }

    // ───────── 내려받기 ─────────
    var LAST_SEL = [], LAST_ST = null;

    function condText() {
        var t = TYPES.filter(function (_, i) { return S.types[i]; }).join('·');
        var z = Object.keys(S.zones).map(function (i) { return META.zones[i]; }).join('·') || '전체';
        var u = Object.keys(S.uses).map(function (i) { return META.uses[i]; }).join('·') || '전체';
        var ri = Object.keys(S.ris).map(function (k) { return k.split('|')[2]; }).join('·');
        return [['사례유형', t], ['시군구', S.sgg || '전체'], ['읍면', S.emd || '전체'],
                ['리', ri || '전체'], ['용도지역', z], ['이용상황', u],
                ['기간', S.yearMin ? S.yearMin + '년 이후' : '전체'],
                ['배분품질', (S.q[0] ? 'O 사용가능 ' : '') + (S.q[1] ? '△ 검토필요' : '') || '없음'],
                ['지표', M().label + (M().unit ? ' (' + M().unit + ')' : '')]];
    }

    function buildSheets() {
        var sel = LAST_SEL;
        // ① 사례 목록
        var head = ['유형', '시군구', '읍면', '리', '용도지역', '이용상황', '연도',
                    '토지단가(원/㎡)', '개별공시지가(원/㎡)', '개공비율', '배분품질'];
        var data = sel.map(function (x) {
            return [TYPES[x.t], x.s, x.e, x.l, META.zones[x.z], META.uses[x.u], x.y || '',
                    x.p || '', x.g || '', x.r,
                    x.t === 2 ? ((x.q || 0) === 0 ? 'O 사용가능' : '△ 검토필요') : ''];
        });
        // ② 통계
        var st = LAST_ST;
        var s2 = [['지표', M().label + (M().unit ? ' (' + M().unit + ')' : '')], []];
        if (st) {
            s2.push(['구분', 'n', '평균', '중위', '표준편차']);
            [['원자료', st.raw], ['IQR 정제', st.ref], ['10% 절사', st.trim]].forEach(function (r) {
                var a = r[1].slice().sort(function (p, q) { return p - q; });
                s2.push([r[0], a.length, mean(a), quantile(a, 0.5), stdev(a)]);
            });
            s2.push([]);
            s2.push(['정제 중위값(대표)', quantile(st.ref, 0.5)]);
            s2.push(['절사평균 10%', mean(st.trim)]);
            s2.push(['Q1', st.q1], ['Q3', st.q3],
                    ['IQR 경계', Math.max(0, st.fenceLo), st.fenceHi], ['제거 건수', st.removed]);
        }
        // ③ 리별
        var by = riAgg();
        var s3 = [['시군구', '읍면', '리', 'n', '정제중위(' + M().label + ')']];
        Object.keys(by).sort().forEach(function (k) {
            var a = by[k], p = k.split('|');
            var m = a.length >= 3 ? quantile(stats(a).ref, 0.5)
                                  : a.slice().sort(function (x, y) { return x - y; })[Math.floor(a.length / 2)];
            s3.push([p[0], p[1], p[2], a.length, m]);
        });
        // ④ 조건
        var s4 = [['항목', '값']].concat(condText())
                 .concat([[], ['추출시각', new Date().toLocaleString('ko-KR')],
                          ['데이터 기준', META.built || ''], ['선택 건수', sel.length]]);
        return {rows: [head].concat(data), stat: s2, ri: s3, cond: s4};
    }

    function stamp() {
        var d = new Date(), z = function (n) { return ('0' + n).slice(-2); };
        return '' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes());
    }

    document.getElementById('btn-xlsx').onclick = function () {
        if (!LAST_SEL.length) { alert('선택된 사례가 없습니다.'); return; }
        if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리를 불러오지 못했습니다. CSV로 받아주세요.'); return; }
        var S4 = buildSheets(), wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S4.rows), '사례목록');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S4.stat), '통계');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S4.ri), '리별');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S4.cond), '추출조건');
        XLSX.writeFile(wb, '그밖의요인_' + M().label + '_' + stamp() + '.xlsx');
    };
    document.getElementById('btn-csv').onclick = function () {
        if (!LAST_SEL.length) { alert('선택된 사례가 없습니다.'); return; }
        var rows = buildSheets().rows;
        var csv = rows.map(function (r) {
            return r.map(function (c) {
                c = (c === null || c === undefined) ? '' : String(c);
                return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
            }).join(',');
        }).join('\r\n');
        var blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8;'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '그밖의요인_' + M().label + '_' + stamp() + '.csv';
        a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    };

    // ───────── 지적편집도 · 위성 ─────────
    (function () {
        var bc = document.getElementById('btn-cadastral'), bh = document.getElementById('btn-hybrid');
        function km() { return window.kakaoMap; }
        function guard() {
            if (!km() || !window.kakao || !kakao.maps) { alert('카카오맵이 로드되지 않아 사용할 수 없습니다.\n(로컬 파일로 열면 도메인 제한에 걸립니다 — GitHub Pages 주소로 접속하세요)'); return false; }
            return true;
        }
        var onCad = false, onSat = false;
        bc.onclick = function () {
            if (!guard()) return;
            var id = kakao.maps.MapTypeId.USE_DISTRICT;
            if (onCad) km().removeOverlayMapTypeId(id); else km().addOverlayMapTypeId(id);
            onCad = !onCad; bc.classList.toggle('on', onCad);
        };
        bh.onclick = function () {
            if (!guard()) return;
            km().setMapTypeId(onSat ? kakao.maps.MapTypeId.ROADMAP : kakao.maps.MapTypeId.HYBRID);
            onSat = !onSat; bh.classList.toggle('on', onSat);
        };
    })();

    // ───────── 전체 갱신 ─────────
    function refresh() {
        renderFilters();
        var sel = ROWS.filter(pass);
        LAST_SEL = sel;
        document.getElementById('cnt-sel').textContent = sel.length.toLocaleString();
        document.getElementById('cnt-all').textContent = ROWS.length.toLocaleString();
        renderStats(sel);
        renderMapAndList();
        renderMarkers();
        // 지표 결측으로 빠진 건수를 숨기지 않고 표시
        var noVal = 0;
        ROWS.forEach(function (x) {
            if (!S.types[x.t]) return;
            if (x.t === 2 && !S.q[x.q || 0]) return;
            if (S.sgg && x.s !== S.sgg) return;
            if (S.emd && x.e !== S.emd) return;
            var rk = Object.keys(S.ris);
            if (rk.length && !S.ris[x.s + '|' + x.e + '|' + x.l]) return;
            var zk = Object.keys(S.zones); if (zk.length && !S.zones[x.z]) return;
            var uk = Object.keys(S.uses); if (uk.length && !S.uses[x.u]) return;
            if (S.yearMin && x.y < S.yearMin) return;
            if (!isFinite(val(x)) || val(x) <= 0) noVal++;
        });
        document.getElementById('dl-note').innerHTML =
            '선택 <b>' + sel.length.toLocaleString() + '</b>건 · 시트 4개(사례목록·통계·리별·추출조건)' +
            (noVal ? '<br><span style="color:#c05621">※ ' + M().label + ' 미기재 ' +
                     noVal.toLocaleString() + '건은 통계에서 제외됨</span>' : '');
    }

    refresh();

    // 첫 화면: 데이터 전체 범위로
    var lls = Object.keys(CENTERS).map(function (k) { return CENTERS[k]; });
    if (lls.length) map.fitBounds(lls, {padding: [40, 40]});
})();
</script>
